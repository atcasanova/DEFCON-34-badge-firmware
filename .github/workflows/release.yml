name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build complete DC34 firmware
        run: ./scripts/build-firmware.sh firmware-build
      - name: Package release assets
        run: |
          mkdir release-assets
          (cd dist && zip -r "../release-assets/dc34-badgebloom-pages-${GITHUB_REF_NAME}.zip" .)
          (cd firmware-build && zip -9 "../release-assets/dc34-badgebloom-firmware-${GITHUB_REF_NAME}.zip" loader.uf2 xous.uf2 swap.uf2 BUILD-MANIFEST.txt SHA256SUMS.txt)
          cp firmware-build/loader.uf2 firmware-build/xous.uf2 firmware-build/swap.uf2 release-assets/
          cp firmware-build/BUILD-MANIFEST.txt release-assets/dc34-badgebloom-firmware-build-manifest.txt
          cp firmware-build/SHA256SUMS.txt "release-assets/dc34-badgebloom-firmware-${GITHUB_REF_NAME}-SHA256SUMS.txt"
          cp firmware/dc34-badgebloom-firmware.patch release-assets/
          cp firmware/dc34-badgebloom-console.patch release-assets/
          (cd release-assets && sha256sum * > "dc34-badgebloom-${GITHUB_REF_NAME}-SHA256SUMS.txt")
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: DC34 BadgeBloom ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
